    <text
       xml:space="preserve"
       style="font-size:4px;font-style:normal;font-weight:normal;line-height:125%;letter-spacing:0px;word-spacing:0px;fill:#000000;fill-opacity:1;stroke:none;display:inline;font-family:Sans"
       x="263.52716"
       y="177.62192"
       id="text3946"
       sodipodi:linespacing="125%"
       transform="matrix(0.9989476,-0.04586607,0.04586607,0.9989476,0,0)"><tspan
         sodipodi:role="line"
         id="tspan3948"
         x="263.52716"
         y="177.62192"
         style="font-size:10px">Thanks for the replly... actually I am using the 1.90 version and I put in a </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="190.12192"
         style="font-size:10px"
         id="tspan4008">html dll from your site. It is showing images now, but it doesnt keep them </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="202.62192"
         style="font-size:10px"
         id="tspan4010">in cache, ie keeps downloading them everytime I open it and its darn slow. </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="215.12192"
         style="font-size:10px"
         id="tspan4012">Also tried to install all other plugins from ur site (especially aspell) but it </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="227.62192"
         style="font-size:10px"
         id="tspan4014">shows loaded, and &quot;aspell doesnt seem to be installed&quot; message??? Also </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="240.12192"
         style="font-size:10px"
         id="tspan4016">its there a way to show the send/recieve progress bar on the top itself?</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="252.62192"
         id="tspan3950"
         style="font-size:10px" /><tspan
         sodipodi:role="line"
         x="263.52716"
         y="265.12192"
         id="tspan3952"
         style="font-size:10px">Cheers</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="277.62192"
         id="tspan3954"
         style="font-size:10px" /><tspan
         sodipodi:role="line"
         x="263.52716"
         y="290.12192"
         id="tspan3956"
         style="font-size:10px">user</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="302.62192"
         id="tspan3958"
         style="font-size:10px" /><tspan
         sodipodi:role="line"
         x="263.52716"
         y="315.12192"
         id="tspan3960"
         style="font-size:10px"> ---------- Original Message ----------</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="327.62192"
         id="tspan3962"
         style="font-size:10px">From: Matthew Allen (fret@memecode.com)</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="340.12192"
         id="tspan3964"
         style="font-size:10px">Subject: Re: Feedback</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="352.62192"
         id="tspan3966"
         style="font-size:10px">Date: 10/31/2011 2:13:04a</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="365.12192"
         id="tspan3968"
         style="font-size:10px" /><tspan
         sodipodi:role="line"
         x="263.52716"
         y="377.62192"
         id="tspan3970"
         style="font-size:10px">---------- Original Message ----------</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="390.12192"
         id="tspan3972"
         style="font-size:10px">To:  (fret@memecode.com)</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="402.62192"
         id="tspan3974"
         style="font-size:10px">From: Arun (arungn@dr.com)</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="415.12192"
         id="tspan3976"
         style="font-size:10px">Subject: Feedback</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="427.62192"
         id="tspan3978"
         style="font-size:10px">Date: 30/10/2011 9:05:02p</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="440.12192"
         id="tspan3980"
         style="font-size:10px" /><tspan
         sodipodi:role="line"
         x="263.52716"
         y="452.62192"
         id="tspan3982"
         style="font-size:10px">&gt; The easiest and fastest email client I have used, great work!! Although I </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="465.12192"
         id="tspan3984"
         style="font-size:10px">&gt; cant get it to show inline images in mails, although it is downloading </tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="477.62192"
         id="tspan3986"
         style="font-size:10px">&gt; them, am i missing someting?</tspan><tspan
         sodipodi:role="line"
         x="263.52716"
         y="490.12192"
         id="tspan4006"
         style="font-size:10px" /></text>
  </g>
